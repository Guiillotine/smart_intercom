x-env: &default-env
  env_file:
    - ../.env

services:
  postgres-smart-intercom:
    container_name: postgres-smart-intercom
    image: pgvector/pgvector:pg15
    <<: *default-env
    ports:
      - "5432:5432"
    volumes:
      - /docker-volumes/smart-intercom/postgres:/var/lib/postgresql/data
    networks:
      - smart-intercom-network

  minio-smart-intercom:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio-smart-intercom
    command: server --console-address ":9001" /data/
    ports:
      - "9006:9000"
      - "9007:9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio@
    volumes:
      - /docker-volumes/smart-intercom/minio:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: on-failure
    networks:
      - smart-intercom-network

  redis-smart-intercom:
    container_name: redis-smart-intercom
    image: redis/redis-stack:6.2.6-v5
    <<: *default-env
    volumes:
      - /docker-volumes/smart-intercom/redis:/data
    restart: on-failure
    ports:
      - "6379:6379"
    networks:
      - smart-intercom-network

networks:
  smart-intercom-network:
    name: smart-intercom-network
