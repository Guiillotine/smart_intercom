x-env: &default-env
  env_file:
    - ../.env

services:
  smart-intercom-backend:
    container_name: smart-intercom-backend
    build:
      context: ..
      dockerfile: deploy/dev.gpu.Dockerfile
    ports:
      - "8000:8000"
    <<: *default-env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - smart-intercom-network
    depends_on:
      postgres-smart-intercom:
        condition: service_healthy
      redis-smart-intercom:
        condition: service_healthy
      minio-smart-intercom:
        condition: service_healthy
      minio-create-buckets:
        condition: service_completed_successfully

  postgres-smart-intercom:
    container_name: postgres-smart-intercom
    image: pgvector/pgvector:pg15
    <<: *default-env
    ports:
      - "5455:5432"
    volumes:
      - /docker-volumes/smart-intercom/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - smart-intercom-network

  minio-smart-intercom:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio-smart-intercom
    <<: *default-env
    command: server --console-address ":9001" /data/
    ports:
      - "9006:9000"
      - "9007:9001"
    volumes:
      - /docker-volumes/smart-intercom/minio:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: on-failure
    networks:
      - smart-intercom-network

  minio-create-buckets:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: minio-create-buckets
    <<: *default-env
    depends_on:
      minio-smart-intercom:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio-smart-intercom:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${S3_VISIT_PHOTO_BUCKET_NAME};
      mc mb --ignore-existing local/$${S3_PERSON_PHOTO_BUCKET_NAME};
      mc mb --ignore-existing local/$${S3_BOT_MESSAGE_BUCKET_NAME};
      mc anonymous set download local/$${S3_VISIT_PHOTO_BUCKET_NAME};
      mc anonymous set download local/$${S3_PERSON_PHOTO_BUCKET_NAME};
      mc anonymous set download local/$${S3_BOT_MESSAGE_BUCKET_NAME};
      "
    networks:
      - smart-intercom-network

  redis-smart-intercom:
    container_name: redis-smart-intercom
    image: redis/redis-stack:6.2.6-v5
    <<: *default-env
    volumes:
      - /docker-volumes/smart-intercom/redis:/data
    restart: on-failure
    ports:
      - "6366:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - smart-intercom-network

networks:
  smart-intercom-network:
    name: smart-intercom-network
